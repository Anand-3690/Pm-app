services:
  app:
    image: ghcr.io/anand-3690/pm-app:latest
    container_name: pm-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3001:3000"
    pull_policy: always
  push-worker:
    image: ghcr.io/anand-3690/pm-app-push-worker:latest
    container_name: pm-app-push-worker
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - default
      - supabase_default

  networks:
    supabase_default:
      external: true